[package]
name = "hydro_solver"
version = "0.1.0"
edition = "2021"
description = "Steady-state hydronic (water heating) network solver compiled to WebAssembly"
license = "MIT"

[lib]
name = "hydro_solver"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# opt-level "z" minimises wasm size. We intentionally keep the default
# unwinding panic strategy (NOT panic="abort") so the `catch_unwind` safety net
# in `solve()` can convert any internal panic into a `status:"error"` result
# instead of aborting the Web Worker.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
